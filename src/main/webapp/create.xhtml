<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Create Pet</title>
</h:head>
<h:body>
    <h1>Add new pet</h1>

    <h:link outcome="listView" value="Back to list" />
    <br/><br/>

    <h:form>
        <h:messages style="color:red;margin:8px;" />

        <h:panelGrid columns="3">
            <h:outputLabel for="name" value="Name:" />
            <h:inputText id="name" value="#{petBean.pet.name}" label="Name" required="true" />
            <h:message for="name" style="color:red" />

            <h:outputLabel for="species" value="Species:" />
            <h:inputText id="species" value="#{petBean.pet.species}" label="Species" required="true" />
            <h:message for="species" style="color:red" />

            <h:outputLabel for="birthDate" value="Birth date:" />
            <h:inputText id="birthDate" value="#{petBean.pet.birthDate}" label="Birth date" required="true"
            converterMessage="Invalid date format.Use YYYY-MM-DD"/>
            <h:message for="birthDate" style="color:red" />

            <h:outputLabel for="ownerName" value="Owner name:" />
            <h:inputText id="ownerName" value="#{petBean.pet.ownerName}" label="Owner name" />
            <h:message for="ownerName" style="color:red" />

            <h:outputLabel for="notes" value="Notes:" />
            <h:inputTextarea id="notes" value="#{petBean.pet.notes}" cols="40" rows="5" label="Notes" />
            <h:message for="notes" style="color:red" />

            <h:outputText value="" />
            <h:commandButton value="Save" action="#{petBean.save}" />
            <h:outputText value="" />
        </h:panelGrid>
    </h:form>
</h:body>
</html>
