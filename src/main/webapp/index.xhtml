<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Pet Clinic</title>
</h:head>
<h:body>
    <h1>Pet Clinic</h1>
     <p>
         Simple Jakarta EE and JSF  application for managing pets.
     </p>

    <ul>
        <li>View pets</li>
        <li>Add new pets</li>
        <li>Display pet details</li>
    </ul>

    <h:link outcome="pets" value="Open pet list" />
    <br/><br/>
    <h:link outcome="pet-create" value="Add new pet" />
    <br/><br/>
    <h:link outcome="pets-without-owner" value="Pets without owners" />
    <br/><br/>
    <h:link value="View newest pets" outcome="newest-pets"/>
    <br/><br/>
    <h:link value="Schedule visit" outcome="visit-request"/>


</h:body>
</html>
